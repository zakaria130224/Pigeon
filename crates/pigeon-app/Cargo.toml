[package]
name = "pigeon-app"
description = "Pigeon, a desktop API client whose collections sync through git"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pigeon"
path = "src/main.rs"

[features]
# Lets a test script click and type in the real window. Never part of a released build.
qa = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pigeon-core.workspace = true
rfd = "0.17.2"
serde_json.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
