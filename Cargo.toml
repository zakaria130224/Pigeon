[workspace]
resolver = "3"
members = ["crates/pigeon-core", "crates/pigeon-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
pigeon-core = { path = "crates/pigeon-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
