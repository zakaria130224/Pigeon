# Builds every package when a version tag such as v1.0.0 is pushed, and prepares a draft release.
# See docs/distribution-runbook.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
      - run: ./packaging/build-windows-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/*.deb

  macos:
    runs-on: macos-latest
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY_LOGIN: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Save the notarization login
        if: env.HAS_NOTARY_LOGIN == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials pigeon --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - run: ./packaging/macos/package.sh
        env:
          PIGEON_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          PIGEON_NOTARY_PROFILE: ${{ env.HAS_NOTARY_LOGIN == 'true' && 'pigeon' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  draft-release:
    needs: [windows-linux, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "Pigeon ${GITHUB_REF_NAME#v}" --generate-notes
